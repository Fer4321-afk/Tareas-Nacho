<h2>Lista de Juegos</h2>

<div>
    <a href="{% url 'crear_juego' %}">Crear nuevo juego</a>
</div>

<ul>
    {% for g in games %}
    <li>
        <a href="{% url 'ver_juego' juego_id=g.id %}">
            Partida {{ g.id }} - turno de {{ g.turno }}
        </a>
    </li>
    {% empty %}
    <li>No hay juegos disponibles</li>
    {% endfor %}
</ul>
